[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chatrag"
version = "0.1.0"
description = "Local, verifiable hybrid retrieval (BM25 + vectors + reranker) over chat exports, served to LLM agents over MCP"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastembed>=0.8",
  "usearch>=2.20",
  "RapidFuzz>=3.0",
  "snowballstemmer>=2.2",
  "Unidecode>=1.3",
  "numpy>=1.26",
  "huggingface_hub>=0.30",
]

[project.scripts]
chatrag = "chatrag.knowledge:main"
chatrag-eval = "chatrag.evaluate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
chatrag = ["aliases.json"]
